<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="88" fill="#09091a"/>
  <!-- hexágono exterior D20 -->
  <polygon points="256,36 452,148 452,364 256,476 60,364 60,148"
           fill="#0e1428" stroke="#e94560" stroke-width="20" stroke-linejoin="round"/>
  <!-- linhas internas -->
  <line x1="256" y1="36"  x2="60"  y2="364" stroke="#e67e22" stroke-width="10" opacity="0.55"/>
  <line x1="256" y1="36"  x2="452" y2="364" stroke="#e67e22" stroke-width="10" opacity="0.55"/>
  <line x1="60"  y1="148" x2="452" y2="148" stroke="#e67e22" stroke-width="10" opacity="0.55"/>
  <line x1="60"  y1="364" x2="452" y2="364" stroke="#e67e22" stroke-width="10" opacity="0.55"/>
  <line x1="60"  y1="148" x2="256" y2="476" stroke="#e67e22" stroke-width="10" opacity="0.55"/>
  <line x1="452" y1="148" x2="256" y2="476" stroke="#e67e22" stroke-width="10" opacity="0.55"/>
  <!-- número 20 -->
  <text x="256" y="310" font-family="Courier New,monospace" font-size="172" font-weight="bold"
        text-anchor="middle" fill="#f5a623">20</text>
  <!-- D20 label pequeno -->
  <text x="256" y="440" font-family="Courier New,monospace" font-size="56" font-weight="bold"
