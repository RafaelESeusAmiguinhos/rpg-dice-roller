<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>RPG Dice Roller 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ── Variáveis ──────────────────────────────────────────────────────────── */
:root{
  --bg:#09091a; --panel:#0e1428; --panel2:#141e3a; --brd:#252f55;
  --gold:#f5a623; --accent:#e94560; --acc2:#b02f47;
  --text:#eaeaea; --sub:#7a7a99;
  --d4:#9b59b6; --d6:#3498db; --d8:#2ecc71; --d12:#e67e22; --d20:#e74c3c;
  --hdr:50px; --ftr:60px; --lw:215px; --rw:225px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  color:var(--text);font-family:'Courier New',Courier,monospace;touch-action:none}

/* ══ DESKTOP ════════════════════════════════════════════════════════════════ */
#app{
  display:grid;height:100vh;
  grid-template-rows:var(--hdr) 1fr var(--ftr);
  grid-template-columns:var(--lw) 1fr var(--rw);
  grid-template-areas:
    "hd hd hd"
    "lt ct rt"
    "ft ft ft";
}

/* ── Header ─────────────────────────────────────────────────────────────── */
header{
  grid-area:hd;background:var(--panel2);border-bottom:2px solid var(--accent);
  display:flex;align-items:center;justify-content:center;gap:12px;z-index:10;
}
header h1{font-size:1.2rem;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}

/* ── Footer ─────────────────────────────────────────────────────────────── */
footer{
  grid-area:ft;background:var(--panel2);border-top:3px solid var(--accent);
  display:flex;align-items:center;justify-content:center;gap:20px;
  padding:0 12px;
}
#total-box{font-size:1.5rem;font-weight:bold;color:var(--gold);letter-spacing:.08em}
#parcelas{font-size:.72rem;color:var(--sub);letter-spacing:.04em}

/* ── Painel Esquerdo ─────────────────────────────────────────────────────── */
#left{
  grid-area:lt;background:var(--panel);border-right:1px solid var(--brd);
  padding:14px 12px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;
}
.slbl{
  font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);
  text-align:center;padding-bottom:4px;border-bottom:1px solid var(--brd);
}
#dice-types{display:flex;flex-direction:column;gap:6px}
.dice-btn{
  display:flex;align-items:center;gap:9px;background:var(--panel2);
  border:1px solid var(--brd);border-radius:7px;padding:9px 11px;cursor:pointer;
  color:inherit;font-family:inherit;font-size:.92rem;font-weight:bold;
  letter-spacing:.06em;transition:all .18s;user-select:none;
}
.dice-btn:hover{border-color:var(--c);transform:translateX(3px)}
.dice-btn.active{background:var(--c);color:#000;border-color:var(--c)}
.pip{width:10px;height:10px;border-radius:2px;background:var(--c);flex-shrink:0}
.dice-btn.active .pip{background:#000}

#qty-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.qty-btn{
  width:38px;height:38px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--brd);color:var(--accent);font-size:1.4rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s;
  font-family:inherit;user-select:none;
}
.qty-btn:hover,.qty-btn:active{background:var(--accent);color:#fff}
#qty-display{font-size:2rem;font-weight:bold;color:var(--text);min-width:36px;text-align:center}

#roll-btn{
  width:100%;padding:13px;border-radius:10px;background:var(--accent);color:#fff;
  border:none;cursor:pointer;font-family:inherit;font-size:.95rem;font-weight:bold;
  letter-spacing:.12em;text-transform:uppercase;transition:.2s;
  box-shadow:0 4px 18px rgba(233,69,96,.35);user-select:none;
}
#roll-btn:hover:not(:disabled){background:var(--acc2);transform:translateY(-1px);
  box-shadow:0 6px 24px rgba(233,69,96,.5)}
#roll-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.hint{font-size:.62rem;color:var(--sub);text-align:center}

/* ── Centro (Three.js) ───────────────────────────────────────────────────── */
#center{grid-area:ct;position:relative;overflow:hidden}
#center canvas{display:block;width:100%!important;height:100%!important}

/* ── Painel Direito ──────────────────────────────────────────────────────── */
#right{
  grid-area:rt;background:var(--panel);border-left:1px solid var(--brd);
  padding:14px 11px;display:flex;flex-direction:column;gap:9px;overflow:hidden;
}
#history-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1}
.hist-item{
  background:var(--panel2);border-radius:6px;padding:6px 9px;
  border-left:3px solid var(--c,var(--accent));font-size:.7rem;
  animation:slide-in .25s ease-out;
}
.hist-type{color:var(--c);font-weight:bold;margin-bottom:1px}
.hist-rolls{color:var(--sub);font-size:.65rem}
.hist-total{color:var(--c);font-weight:bold;font-size:.85rem}

/* ── Barra Mobile (oculta no desktop) ───────────────────────────────────── */
#mobile-bar{display:none}

/* ══ ANIMAÇÕES ══════════════════════════════════════════════════════════════ */
@keyframes slide-in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes pop-in{
  0%{transform:scale(.5);opacity:0}55%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.total-pop{animation:pop-in .35s ease-out forwards}

/* ══ RESPONSIVO — MOBILE ════════════════════════════════════════════════════ */
@media(max-width:680px){
  :root{--hdr:44px;--ftr:54px}

  #app{
    grid-template-columns:1fr;
    grid-template-rows:var(--hdr) 1fr auto var(--ftr);
    grid-template-areas:
      "hd"
      "ct"
      "mb"
      "ft";
  }
  header h1{font-size:.95rem;letter-spacing:.1em}

  /* Oculta sidebars */
  #left,#right{display:none}

  /* Barra de controles mobile */
  #mobile-bar{
    grid-area:mb;display:flex;flex-direction:column;
    background:var(--panel);border-top:1px solid var(--brd);
    padding:10px 12px;gap:10px;
  }

  /* Dados em linha horizontal */
  #mobile-dice-row{
    display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;
  }
  #mobile-dice-row::-webkit-scrollbar{display:none}
  .m-dice-btn{
    flex-shrink:0;padding:8px 14px;border-radius:8px;
    background:var(--panel2);border:2px solid var(--brd);
    color:var(--c);font-family:inherit;font-size:.88rem;font-weight:bold;
    cursor:pointer;transition:.15s;white-space:nowrap;user-select:none;
  }
  .m-dice-btn.active{background:var(--c);color:#000;border-color:var(--c)}

  /* Linha de quantidade + jogar */
  #mobile-bottom-row{
    display:flex;align-items:center;gap:10px;
  }
  #mobile-qty{
    display:flex;align-items:center;gap:8px;
    background:var(--panel2);border-radius:8px;padding:4px 10px;
    border:1px solid var(--brd);
  }
  .m-qty-btn{
    background:none;border:none;color:var(--accent);font-size:1.5rem;
    cursor:pointer;padding:0 4px;font-family:inherit;user-select:none;line-height:1;
  }
  #m-qty-display{font-size:1.3rem;font-weight:bold;min-width:24px;text-align:center}

  #m-roll-btn{
    flex:1;padding:12px;border-radius:10px;background:var(--accent);color:#fff;
    border:none;cursor:pointer;font-family:inherit;font-size:.95rem;font-weight:bold;
    letter-spacing:.1em;text-transform:uppercase;transition:.2s;user-select:none;
  }
  #m-roll-btn:disabled{opacity:.45;cursor:not-allowed}

  /* Histórico mobile → botão toggle */
  #m-hist-toggle{
    position:absolute;top:calc(var(--hdr) + 8px);right:8px;z-index:20;
    background:var(--panel2);border:1px solid var(--brd);border-radius:8px;
    color:var(--sub);font-size:.7rem;font-family:inherit;cursor:pointer;
    padding:5px 10px;letter-spacing:.08em;
  }
  #m-hist-panel{
    display:none;position:absolute;top:calc(var(--hdr) + 36px);right:8px;
    width:min(260px,85vw);max-height:50vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--brd);border-radius:10px;
    padding:10px;z-index:20;
    box-shadow:0 8px 32px rgba(0,0,0,.6);
  }
  #m-hist-panel.open{display:flex;flex-direction:column;gap:6px}

  footer{padding:0 10px}
  #total-box{font-size:1.25rem}
  #parcelas{font-size:.65rem}
}
</style>
</head>
<body>
<div id="app">
  <header><span>⚔</span><h1>RPG Dice Roller 3D</h1><span>⚔</span></header>

  <!-- Painel Esquerdo (desktop) -->
  <div id="left">
    <div class="slbl">Tipo de Dado</div>
    <div id="dice-types">
      <button class="dice-btn" data-dice="D4"  style="--c:var(--d4)"><span class="pip"></span>D4</button>
      <button class="dice-btn" data-dice="D6"  style="--c:var(--d6)"><span class="pip"></span>D6</button>
      <button class="dice-btn" data-dice="D8"  style="--c:var(--d8)"><span class="pip"></span>D8</button>
      <button class="dice-btn" data-dice="D12" style="--c:var(--d12)"><span class="pip"></span>D12</button>
      <button class="dice-btn active" data-dice="D20" style="--c:var(--d20)"><span class="pip"></span>D20</button>
    </div>
    <div class="slbl">Quantidade</div>
    <div id="qty-row">
      <button class="qty-btn" id="btn-minus">−</button>
      <span id="qty-display">1</span>
      <button class="qty-btn" id="btn-plus">+</button>
    </div>
    <button id="roll-btn">🎲 &nbsp;JOGAR</button>
    <div class="hint">[ESPAÇO] para jogar</div>
    <div class="hint">[1‑5] seleciona dado</div>
  </div>

  <!-- Centro: Three.js -->
  <div id="center">
    <!-- Toggle histórico mobile -->
    <button id="m-hist-toggle">HIST ▾</button>
    <div id="m-hist-panel"></div>
  </div>

  <!-- Painel Direito (desktop) -->
  <div id="right">
    <div class="slbl">Histórico</div>
    <div id="history-list"></div>
  </div>

  <!-- Barra Mobile -->
  <div id="mobile-bar">
    <div id="mobile-dice-row">
      <button class="m-dice-btn" data-mdice="D4"  style="--c:var(--d4)">D4</button>
      <button class="m-dice-btn" data-mdice="D6"  style="--c:var(--d6)">D6</button>
      <button class="m-dice-btn" data-mdice="D8"  style="--c:var(--d8)">D8</button>
      <button class="m-dice-btn" data-mdice="D12" style="--c:var(--d12)">D12</button>
      <button class="m-dice-btn active" data-mdice="D20" style="--c:var(--d20)">D20</button>
    </div>
    <div id="mobile-bottom-row">
      <div id="mobile-qty">
        <button class="m-qty-btn" id="m-btn-minus">−</button>
        <span id="m-qty-display">1</span>
        <button class="m-qty-btn" id="m-btn-plus">+</button>
      </div>
      <button id="m-roll-btn">🎲 JOGAR</button>
    </div>
  </div>

  <footer>
    <div id="total-box">TOTAL: —</div>
    <div id="parcelas"></div>
  </footer>
</div>

<script>
// ── Constantes ───────────────────────────────────────────────────────────────
const DICE_HEX  = {D4:'#9b59b6',D6:'#3498db',D8:'#2ecc71',D12:'#e67e22',D20:'#e74c3c'};
const DICE_SIDES = {D4:4,D6:6,D8:8,D12:12,D20:20};

// ── Estado ───────────────────────────────────────────────────────────────────
let selDice  = 'D20';
let quantity = 1;
let rolling  = false;
let diceObjs = [];
let rollStart = null;
const ROLL_DUR = 2000;

// ── Three.js ─────────────────────────────────────────────────────────────────
const container = document.getElementById('center');
const W = () => container.clientWidth;
const H = () => container.clientHeight;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W(),H());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x09091a);
container.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.fog    = new THREE.Fog(0x09091a, 18, 35);

const camera = new THREE.PerspectiveCamera(55, W()/H(), 0.1, 100);
camera.position.set(0, 6, 13);
camera.lookAt(0, 0, 0);

// Luzes
scene.add(new THREE.AmbientLight(0x334466, 1.3));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 12, 8);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024,1024);
Object.assign(dirLight.shadow.camera,{near:.5,far:50,left:-10,right:10,top:10,bottom:-10});
scene.add(dirLight);
scene.add(Object.assign(new THREE.DirectionalLight(0x4466ff,.55),{position:new THREE.Vector3(-8,4,-5)}));
const diceLight = new THREE.PointLight(0xe74c3c, 2, 14);
diceLight.position.set(0,5,3);
scene.add(diceLight);

// Chão + grade
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40,40),
  new THREE.MeshStandardMaterial({color:0x060616,roughness:.9,metalness:.1})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -1.8;
floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(30,30,0x1a1a55,0x111140);
grid.position.y = -1.79;
scene.add(grid);
// Bordas neon
[-8,8].forEach(x => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(.06,.06,30),
    new THREE.MeshBasicMaterial({color:0xe94560}));
  b.position.set(x,-1.77,0);
  scene.add(b);
});

// ── Geometrias ───────────────────────────────────────────────────────────────
function buildMesh(dtype) {
  const geos = {
    D4 : new THREE.TetrahedronGeometry(1.1),
    D6 : new THREE.BoxGeometry(1.6,1.6,1.6),
    D8 : new THREE.OctahedronGeometry(1.2),
    D12: new THREE.DodecahedronGeometry(1.15),
    D20: new THREE.IcosahedronGeometry(1.2),
  };
  const geo  = geos[dtype];
  const clr  = new THREE.Color(DICE_HEX[dtype]);
  const mat  = new THREE.MeshPhongMaterial({
    color:clr,
    emissive:clr.clone().multiplyScalar(.12),
    specular:new THREE.Color(0xffffff),
    shininess:90,
    flatShading:true,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.22})
  ));
  return mesh;
}

// ── Sprite de número ─────────────────────────────────────────────────────────
function makeSprite(number, hex) {
  const S = 256, c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.beginPath();
  ctx.arc(S/2,S/2,S/2-6,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.75)'; ctx.fill();
  ctx.strokeStyle=hex; ctx.lineWidth=8; ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.font=`bold ${number>9?108:140}px 'Courier New'`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(number),S/2,S/2+4);
  const spr = new THREE.Sprite(
    new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false})
  );
  spr.scale.set(2.2,2.2,1);
  spr.visible = false;
  return spr;
}

// ── Easing ───────────────────────────────────────────────────────────────────
function easeOutBounce(t){
  if(t<1/2.75)     return 7.5625*t*t;
  if(t<2/2.75)   { t-=1.5/2.75;  return 7.5625*t*t+.75; }
  if(t<2.5/2.75) { t-=2.25/2.75; return 7.5625*t*t+.9375; }
                   t-=2.625/2.75; return 7.5625*t*t+.984375;
}
function easeOutExpo(t){ return t===1?1:1-Math.pow(2,-10*t); }

// ── Roll ─────────────────────────────────────────────────────────────────────
function clearDice() {
  diceObjs.forEach(d => { scene.remove(d.mesh); scene.remove(d.sprite); });
  diceObjs = [];
}

function startRoll() {
  if(rolling) return;
  rolling = true;
  setRollBtnsDisabled(true);
  document.getElementById('total-box').textContent = 'TOTAL: —';
  document.getElementById('parcelas').textContent  = '';
  clearDice();

  const dtype  = selDice;
  const qty    = quantity;
  const sides  = DICE_SIDES[dtype];
  const values = Array.from({length:qty}, () => Math.ceil(Math.random()*sides));

  const spacing = Math.min(3.0, 8 / Math.max(qty,1));
  diceLight.color.set(new THREE.Color(DICE_HEX[dtype]));

  diceObjs = values.map((val, i) => {
    const mesh   = buildMesh(dtype);
    const sprite = makeSprite(val, DICE_HEX[dtype]);
    const x      = (i-(qty-1)/2)*spacing;
    mesh.position.set(x, 9, 0);
    mesh.rotation.set(Math.random()*6, Math.random()*6, Math.random()*6);
    sprite.position.set(x, 1.4, 0);
    scene.add(mesh); scene.add(sprite);
    return {mesh, sprite, x,
      vx:(Math.random()-.5)*18, vy:(Math.random()-.5)*22, vz:(Math.random()-.5)*14,
      value:val};
  });
  rollStart = performance.now();
}

function finishRoll() {
  rolling = false;
  const values = diceObjs.map(d => d.value);
  const total  = values.reduce((a,b)=>a+b,0);
  const dtype  = selDice;

  diceObjs.forEach((d,i) => setTimeout(()=>{ d.sprite.visible=true; }, i*130));

  setTimeout(()=>{
    const tb = document.getElementById('total-box');
    tb.textContent = `TOTAL:  ${total}`;
    tb.classList.remove('total-pop'); void tb.offsetWidth; tb.classList.add('total-pop');
    if(values.length>1) document.getElementById('parcelas').textContent = values.join(' + ');
    addHistory(dtype, values, total);
    setRollBtnsDisabled(false);
  }, diceObjs.length*130+150);
}

function setRollBtnsDisabled(v) {
  document.getElementById('roll-btn').disabled    = v;
  document.getElementById('m-roll-btn').disabled  = v;
}

// ── Histórico ─────────────────────────────────────────────────────────────────
function addHistory(dtype, vals, total) {
  const clr = DICE_HEX[dtype];
  const html = `<div class="hist-item" style="--c:${clr}">
    <div class="hist-type">${vals.length}${dtype}</div>
    <div class="hist-rolls">[${vals.join(', ')}]</div>
    <div class="hist-total">= ${total}</div></div>`;

  // Desktop
  const dl = document.getElementById('history-list');
  dl.insertAdjacentHTML('afterbegin', html);
  while(dl.children.length>14) dl.removeChild(dl.lastChild);

  // Mobile painel
  const mp = document.getElementById('m-hist-panel');
  mp.insertAdjacentHTML('afterbegin', html);
  while(mp.children.length>8) mp.removeChild(mp.lastChild);
}

// ── Loop ─────────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if(rolling && rollStart!==null) {
    const elapsed = performance.now()-rollStart;
    const t = Math.min(elapsed/ROLL_DUR, 1.0);
    const spinDecay = 1-easeOutExpo(t);
    diceObjs.forEach(d => {
      const fallT  = Math.min(elapsed/900,1.0);
      d.mesh.position.y = Math.max(0,9*(1-easeOutBounce(fallT)))-1.0;
      d.mesh.rotation.x += d.vx*spinDecay*dt;
      d.mesh.rotation.y += d.vy*spinDecay*dt;
      d.mesh.rotation.z += d.vz*spinDecay*dt;
    });
    if(t>=1.0){ rolling=false; finishRoll(); }
  } else if(diceObjs.length>0) {
    diceObjs.forEach(d => { d.mesh.rotation.y += .35*dt; });
  }

  diceLight.intensity = Math.sin(Date.now()*.002)*.3+1.6;
  renderer.render(scene, camera);
}
animate();

// ── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{
  renderer.setSize(W(),H());
  camera.aspect = W()/H();
  camera.updateProjectionMatrix();
});

// ── UI Desktop ───────────────────────────────────────────────────────────────
function selectDice(d) {
  selDice = d;
  document.querySelectorAll('.dice-btn').forEach(b => b.classList.toggle('active', b.dataset.dice===d));
  document.querySelectorAll('.m-dice-btn').forEach(b => b.classList.toggle('active', b.dataset.mdice===d));
  diceLight.color.set(new THREE.Color(DICE_HEX[d]));
}

document.querySelectorAll('.dice-btn').forEach(b =>
  b.addEventListener('click', () => selectDice(b.dataset.dice)));

const qtyEl = document.getElementById('qty-display');
const mqtyEl = document.getElementById('m-qty-display');
function setQty(n) {
  quantity = Math.max(1, Math.min(8, n));
  qtyEl.textContent = mqtyEl.textContent = quantity;
}
document.getElementById('btn-minus').addEventListener('click', ()=>setQty(quantity-1));
document.getElementById('btn-plus').addEventListener('click',  ()=>setQty(quantity+1));
document.getElementById('roll-btn').addEventListener('click', startRoll);

// ── UI Mobile ─────────────────────────────────────────────────────────────────
document.querySelectorAll('.m-dice-btn').forEach(b =>
  b.addEventListener('click', () => selectDice(b.dataset.mdice)));
document.getElementById('m-btn-minus').addEventListener('click', ()=>setQty(quantity-1));
document.getElementById('m-btn-plus').addEventListener('click',  ()=>setQty(quantity+1));
document.getElementById('m-roll-btn').addEventListener('click', startRoll);

// Toggle histórico mobile
const mHistToggle = document.getElementById('m-hist-toggle');
const mHistPanel  = document.getElementById('m-hist-panel');
mHistToggle.addEventListener('click',()=>mHistPanel.classList.toggle('open'));
document.addEventListener('click', e=>{
  if(!mHistPanel.contains(e.target)&&e.target!==mHistToggle)
    mHistPanel.classList.remove('open');
});

// ── Teclado ───────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); startRoll(); }
  const map={Digit1:'D4',Digit2:'D6',Digit3:'D8',Digit4:'D12',Digit5:'D20'};
  if(map[e.code]) selectDice(map[e.code]);
});
</script>
</body>
</html>
